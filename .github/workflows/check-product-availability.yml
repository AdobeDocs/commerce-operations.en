name: Check product availability versions

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 7:00 AM UTC, every weekday
  workflow_dispatch:

concurrency:
  group: check-product-availability
  cancel-in-progress: false

jobs:
  check-versions:
    if: github.repository_owner == 'Adobe-Enterprise-Docs' && endsWith(github.repository, '.en')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true
          working-directory: _jekyll

      - name: Run check_product_availability_versions
        id: run-check
        working-directory: _jekyll
        run: |
          bundle exec rake check_product_availability_versions
          cat tmp/product-availability-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render templated changes
        id: render
        working-directory: _jekyll
        run: bundle exec rake render

      - name: Generate GitHub App token
        id: app-token
        if: always()
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SCCM_GITHUB_APP_ID }}
          private-key: ${{ secrets.SCCM_GITHUB_APP_PRIVATE_KEY }}

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: chore/update-product-availability-versions
          delete-branch: true
          add-paths: |
            _jekyll/_data/product-availability.yml
            help/_includes/templated/product-availability-extensions.md
            help/_includes/templated/product-availability-services.md
          commit-message: "chore: update product availability versions to match latest release notes"
          title: "chore[bot]: update product availability versions"
          body-path: _jekyll/tmp/product-availability-report.md
          labels: devops, maintenance
          assignees: shevtsov_adobe
          reviewers: meker_adobe

      - name: Open or update manual-review issue
        if: always() && steps.run-check.outcome == 'success' && steps.create-pr.outcome == 'success' && steps.create-pr.outputs.pull-request-number == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('_jekyll/tmp/product-availability-report.md', 'utf8');
            if (!report.includes('Needs manual review')) return;

            const title = 'Product availability: entries need manual review';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'devops,bug',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
                labels: ['devops', 'bug'],
                assignees: ['shevtsov_adobe'],
              });
            }

      - name: Open or update workflow-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const title = 'Product availability check workflow failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The [check-product-availability workflow run](${runUrl}) failed. See the run logs for details.`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'devops,bug',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['devops', 'bug'],
                assignees: ['shevtsov_adobe'],
              });
            }
