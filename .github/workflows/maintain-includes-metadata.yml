name: Maintain includes metadata timestamps

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 6:00 AM UTC, Monday-Friday
  workflow_dispatch:

concurrency:
  group: maintain-includes-metadata
  cancel-in-progress: false

jobs:
  maintain-metadata:
    if: github.repository_owner == 'Adobe-Enterprise-Docs' && endsWith(github.repository, '.en')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure local main ref exists
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true
          working-directory: _jekyll

      - name: Run includes:maintain_metadata_timestamps
        working-directory: _jekyll
        run: bundle exec rake includes:maintain_metadata_timestamps

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SCCM_GITHUB_APP_ID }}
          private-key: ${{ secrets.SCCM_GITHUB_APP_PRIVATE_KEY }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: chore/maintain-includes-metadata
          delete-branch: true
          add-paths: help/**
          commit-message: "chore: update last-update timestamps for topics with includes"
          title: "chore[bot]: update last-update timestamps for topics with includes"
          body: |
            Automated update generated by `bundle exec rake includes:maintain_metadata_timestamps`.

            This refreshes `last-update` front matter for topics whose transcluded include content changed.
          labels: devops, maintenance
          assignees: shevtsov_adobe
